<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#3a2560"/>
      <stop offset="45%" stop-color="#221737"/>
      <stop offset="100%" stop-color="#0b0912"/>
    </radialGradient>
    <linearGradient id="bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0912" stop-opacity="0"/>
      <stop offset="100%" stop-color="#08060e"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="60"/></filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#glow)"/>

  <!-- soft floating light blobs -->
  <g filter="url(#blur)" opacity="0.55">
    <circle cx="230" cy="360" r="180" fill="#b072ff"/>
    <circle cx="880" cy="620" r="200" fill="#6ee7b7"/>
    <circle cx="540" cy="1150" r="220" fill="#7d4fd6"/>
    <circle cx="200" cy="1500" r="160" fill="#ff6bd6"/>
  </g>

  <!-- faint musical notes -->
  <g fill="#ffffff" opacity="0.05" font-family="sans-serif" font-size="120">
    <text x="120" y="900">♪</text>
    <text x="820" y="1080">♫</text>
    <text x="640" y="500">♪</text>
    <text x="300" y="1300">♫</text>
  </g>

  <rect width="1080" height="1920" fill="url(#bottom)"/>
</svg>
