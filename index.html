<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0912" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Musafir — music for every mile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Rozha+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css?v=5" />
</head>
<body>
  <div class="bg"></div>
  <audio id="audio" preload="auto"></audio>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-name">🛺 Musafir</span>
        <span class="brand-tag">music for every mile</span>
      </div>
      <div class="online"><span class="dot"></span><span id="onlineCount">0</span> online</div>
      <div class="links">
        <a id="spotifyLink" href="#" target="_blank" rel="noopener" class="link spotify" title="Open on Spotify" aria-label="Open on Spotify">Spotify</a>
        <a id="ytmusicLink" href="#" target="_blank" rel="noopener" class="link ytmusic" title="Open on YT Music" aria-label="Open on YT Music">YT Music</a>
      </div>
    </header>

    <!-- Big stylised Hindi title in the centre -->
    <div class="hero"><span class="hero-title">मुसाफ़िर</span></div>

    <!-- Floating pill player at the bottom-center -->
    <div class="bottom">
      <div class="hint" id="hint"></div>
      <footer class="dock">
        <div class="thumb" id="coverArt">🎵</div>
        <div class="meta">
          <div class="title" id="trackTitle">Loading…</div>
          <div class="artist" id="trackArtist"></div>
          <div class="seek">
            <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1" />
            <div class="times"><span id="curTime">0:00</span> / <span id="durTime">0:00</span></div>
          </div>
        </div>
        <div class="controls">
          <button id="prevBtn" title="Previous" aria-label="Previous">⏮</button>
          <button id="playBtn" class="play" title="Play/Pause" aria-label="Play or pause">▶</button>
          <button id="nextBtn" title="Next" aria-label="Next">⏭</button>
        </div>
      </footer>
    </div>
  </div>

  <script src="/static/app.js?v=3"></script>
</body>
</html>
